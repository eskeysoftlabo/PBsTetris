<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PB's Tamriel de Tetris — 画面プレビュー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0e10;color:#e5decc;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at 50% 30%,#28303980,transparent 70%)}header{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:18px 30px;border-bottom:1px solid #75634640;background:#101418}h1{margin:0;font-size:15px;font-weight:500;letter-spacing:.07em}small{display:block;color:#9b9d9c;font-size:11px;margin-top:6px}nav{display:flex;gap:5px;flex-wrap:wrap}button{background:transparent;color:#abaea9;border:1px solid #49483e;border-radius:4px;padding:9px 18px;cursor:pointer;font:inherit;font-size:13px}button[aria-pressed=true]{background:#a98d4c20;border-color:#c0a05e;color:#edd6a1}button:hover{color:#fff;border-color:#b7a580}button:focus-visible{outline:2px solid #ddc18b;outline-offset:3px}main{padding:20px;display:flex;flex-direction:column;align-items:center}canvas{display:block;width:min(1100px,calc((100vh - 155px)*1.177));max-width:100%;height:auto;box-shadow:0 20px 70px #0008}footer{text-align:center;font-size:11px;color:#979b9c;padding:12px 16px;line-height:1.7}#error{color:#efbaa1}@media(max-width:700px){header{padding:14px;flex-direction:column;align-items:flex-start}canvas{width:100%}main{padding:12px}button{padding:8px 12px}}

html,body{width:100%;height:100%;overflow:hidden}body{background:#07101b url('../art/sanctuary-source.png') center/cover no-repeat}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,#05101b22,#02070c44 50%,#05101b22);pointer-events:none}header{position:fixed;right:16px;top:12px;z-index:5;padding:8px;border:1px solid #b9d4e333;border-radius:6px;background:#07101be8;opacity:.28;transition:opacity .2s;max-width:calc(100% - 32px)}header:hover,header:focus-within{opacity:1}header>div{display:none}nav{justify-content:flex-end;gap:4px}button{font-size:11px;padding:7px 9px}main{position:fixed;inset:0;padding:8px;justify-content:center}canvas{height:calc(100dvh - 16px);width:auto;max-width:100%;object-fit:contain;box-shadow:none;position:relative;z-index:1}footer{position:fixed;bottom:10px;left:14px;max-width:215px;text-align:left;background:#07101b99;border-left:1px solid #a6b7bc44;font-size:10px;z-index:3;padding:8px;opacity:.65}footer br{display:none}body.immersive header,body.immersive footer{display:none}#exit-immersive{display:none;position:fixed;right:16px;top:14px;z-index:9;background:#07101baa;opacity:.25}#exit-immersive:hover{opacity:1}body.immersive #exit-immersive{display:block}.snow{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}.snow i{position:absolute;top:-8px;background:#dcecf5;border-radius:50%;animation:fall linear infinite;opacity:.4}@keyframes fall{to{transform:translate(50px,110vh)}}@media(prefers-reduced-motion:reduce){.snow i{animation:none}}#error{position:fixed;bottom:4px;z-index:8}@media(max-width:700px){header{left:8px;right:8px;top:8px;max-width:none}footer{max-width:180px;font-size:9px}canvas{height:auto;width:100%;max-height:calc(100dvh - 70px)}}
</style></head><body>
<header><div><h1>PB'S TAMRIEL DE TETRIS</h1><small>画面デザインのプレビュー · 1.7.0</small></div><nav aria-label="表示モード"><button data-mode="solo" aria-pressed="true">ソロ</button><button data-mode="versus" aria-pressed="false">対戦</button><button data-mode="20g" aria-pressed="false">20G実演</button><button data-mode="pause" aria-pressed="false">一時停止</button><button id="music" aria-pressed="false">BGMを聴く</button><button id="sfx">効果音を試す</button><button id="immersive">没入表示</button></nav></header><button id="exit-immersive">表示を戻す</button><div class="snow" aria-hidden="true"></div><audio id="bgm" src="../audio/stone-and-snow-epic.mp3?v=1.7.0" preload="metadata" loop></audio>
<main><canvas id="game" width="1100" height="934" role="img" aria-label="石造りの背景に、10列20行のテトリス盤面。左にホールドとスコア、右に次のブロックを表示。"></canvas><div id="error" role="alert"></div></main>
<footer>画面・音のプレビュー。独自アレンジBGMはブラウザ用です。PS5ではESO標準BGM・内蔵効果音を使います。数値はデモ表示。</footer>
<script src="state.js?v=1.7.0"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),art=new Image();let mode='solo';let demoFrame=0,demoStart=0;
const colors=[[.35,.82,.87],[.94,.8,.35],[.72,.45,.85],[.38,.55,.94],[.94,.57,.3],[.45,.8,.46],[.88,.38,.39],[.52,.53,.55]];
function tinted(rgb){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.drawImage(art,0,0,512,512);x.globalCompositeOperation='multiply';x.fillStyle=`rgb(${rgb.map(v=>Math.round(v*255)).join(',')})`;x.fillRect(0,0,512,512);x.globalCompositeOperation='destination-in';x.drawImage(art,0,0,512,512);return c}
let tiles=[],background;
function text(value,x,y,w,size,color='#e6dbbd'){ctx.fillStyle=color;ctx.font=`${size}px "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif`;ctx.textAlign='center';ctx.textBaseline='top';value.split('\n').forEach((line,i)=>ctx.fillText(line,x+w/2,y+i*size*1.35,w))}
function box(x,y,w,h){ctx.fillStyle='rgba(5,6,7,.97)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#7a6642';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1)}
function tile(v,x,y,size){if(!v)return;ctx.globalAlpha=v<0?.23:1;ctx.drawImage(tiles[Math.abs(v)-1],x,y,size-2,size-2);ctx.globalAlpha=1}
function draw(){if(!background)return;const demo=mode==='20g'?PREVIEW_20G[demoFrame]:null;ctx.clearRect(0,0,1100,934);ctx.globalAlpha=.88;ctx.drawImage(background,0,0,1100,850);ctx.globalAlpha=1;
text('ゲームセンターPX',0,30,1100,22);text('タムリエル de テトリス',0,63,1100,42,'#e8c47a');text(mode==='versus'?'対戦相手：@TamrielTraveler':(demo?'20G 実演 · 出現と同時に接地':'ひとりで挑戦 · スコアアタック'),0,118,1100,22);
box(390,162,320,620);for(let y=0;y<20;y++)for(let x=0;x<10;x++){let v=(demo?demo[0]:PREVIEW_STATE.board)[y+2][x];if(mode==='versus'&&y>=18)v=x===3?0:8;tile(v,400+x*30,172+y*30,30)}
text('ホールド',65,173,270,27);text('次のブロック',765,173,270,27);
(demo?demo[2]:PREVIEW_STATE.minis).forEach(([id,cells],i)=>{const x=i===0?65:765,y=i===0?220:220+(i-1)*112;cells.forEach(([cx,cy])=>tile(id,x+75+cx*27,y+cy*27,27))});
text(demo?'スコア\n'+demo[3]+'\n\n20G 実演中':'スコア\n12480\n\n消したライン　24\nレベル　3',65,390,270,27);text('自己ベスト\n28640',65,670,270,22);
text(mode==='versus'?'相手の高さ　12 / 22\n受けるおじゃま　3 段\n送ったおじゃま　8 段':(demo?'出現 → 即時接地\n横移動後も即時接地\n固定猶予 0.5秒':'10ラインごとに速度上昇\nレベル20から20G'),755,575,290,22);
text('方向キー：移動　下：速く落とす　上：一気に落とす　L1：左回転',45,800,1010,18);
if(mode==='pause'){box(402,365,296,200);text('一時停止\n\n再開して冒険の続きを',410,380,280,27)}
ctx.fillStyle='rgba(5,12,20,.7)';ctx.fillRect(0,850,1100,84);ctx.strokeStyle='#776447';ctx.beginPath();ctx.moveTo(45,850.5);ctx.lineTo(1055,850.5);ctx.stroke();
text((mode==='pause'?'決定：再開':'決定：右回転')+'　　□ 一気に落とす　　△ ホールド　　'+(mode==='versus'?'戻る：降参':'戻る：'+(mode==='pause'?'閉じる':'一時停止'))+'　　L1 左回転',20,882,1060,20);
if(demo){text('固定まで '+Math.max(0,.5-demo[1]).toFixed(2)+'秒',750,718,290,18);ctx.fillStyle='#172c39';ctx.fillRect(790,755,220,5);ctx.fillStyle='#dbbd7a';ctx.fillRect(790,755,220*Math.min(1,demo[1]/.5),5)}canvas.dataset.mode=mode;
}
document.querySelectorAll('button[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;demoFrame=0;demoStart=performance.now();document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));draw();syncMusic()}));
art.onload=()=>{tiles=colors.map(tinted);background=tinted([.22,.29,.34]);draw();window.previewReady=true};art.onerror=()=>{document.querySelector('#error').textContent='石の画像を読み込めませんでした。'};art.src='../art/stone-source.png';

function animateDemo(now){if(mode==='20g'&&!document.hidden){demoFrame=Math.floor((now-demoStart)/20)%PREVIEW_20G.length;draw()}requestAnimationFrame(animateDemo)}requestAnimationFrame(animateDemo);
const bgm=document.getElementById('bgm');bgm.volume=.48;let musicEnabled=false,ac;
async function syncMusic(){if(!musicEnabled||mode==='pause'||document.hidden){bgm.pause();return}try{await bgm.play()}catch(e){musicEnabled=false;document.querySelector('#music').textContent='BGMを聴く';document.querySelector('#music').setAttribute('aria-pressed','false')}}
document.querySelector('#music').onclick=()=>{musicEnabled=!musicEnabled;document.querySelector('#music').textContent=musicEnabled?'BGM：入':'BGM：切';document.querySelector('#music').setAttribute('aria-pressed',String(musicEnabled));syncMusic()};
document.addEventListener('visibilitychange',()=>{if(document.hidden){bgm.pause();if(ac)ac.suspend()}else{musicEnabled=false;document.querySelector('#music').textContent='BGMを聴く';document.querySelector('#music').setAttribute('aria-pressed','false')}});
document.querySelector('#sfx').onclick=async()=>{ac=ac||new AudioContext();await ac.resume();const t=ac.currentTime;[98,147,196].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t+i*.08);g.gain.setValueAtTime(.0001,t+i*.08);g.gain.exponentialRampToValueAtTime(.13,t+i*.08+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*.08+.6);o.connect(g).connect(ac.destination);o.start(t+i*.08);o.stop(t+i*.08+.65)})};
document.querySelector('#immersive').onclick=async()=>{document.body.classList.add('immersive');if(document.documentElement.requestFullscreen){try{await document.documentElement.requestFullscreen()}catch(e){/* The full-viewport layout still works in an embedded browser. */}}};
function leave(){document.body.classList.remove('immersive');if(document.fullscreenElement)document.exitFullscreen()}
document.querySelector('#exit-immersive').onclick=leave;document.addEventListener('keydown',e=>{if(e.key==='Escape')leave()});document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('immersive')});
for(let i=0;i<40;i++){const snow=document.createElement('i');const left=(i*73)%100;snow.style.cssText=`left:${left}%;width:${i%3+1}px;height:${i%3+1}px;animation-duration:${9+i%9}s;animation-delay:-${i%18}s;opacity:${left>30&&left<70?.1:.4}`;document.querySelector('.snow').appendChild(snow)}
</script></body></html>
